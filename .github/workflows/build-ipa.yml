name: Build iOS IPA (BudgetPlanner)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          echo "Active Xcode: $(xcode-select -p)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild -project BudgetPlanner.xcodeproj \
            -scheme BudgetPlanner \
            -destination "generic/platform=iOS" \
            -configuration Release \
            archive \
            -archivePath build/BudgetPlanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/BudgetPlanner.xcarchive/Products/Applications/BudgetPlanner.app Payload/
          zip -r BudgetPlanner.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudgetPlanner-iOS-App
          path: BudgetPlanner.ipa
          retention-days: 14

      - name: Publish Release Asset (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BudgetPlanner.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
