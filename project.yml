name: BudgetPlanner
options:
  bundleIdPrefix: nl.ivoozz
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone & iPad
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  BudgetPlanner:
    type: application
    platform: iOS
    sources:
      - path: BudgetPlanner
    info:
      path: BudgetPlanner/Info.plist
      properties:
        CFBundleDisplayName: "Budget"
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
          - processing
        NSFaceIDUsageDescription: "BudgetPlanner gebruikt Face ID om je financiële gegevens te beschermen."
        NSCameraUsageDescription: "BudgetPlanner gebruikt de camera om bonnen en transacties te scannen."
